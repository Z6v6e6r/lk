<!--
  Tilda, блок T123 «HTML-код».
  Витрина расписания по выбранным категориям (слайдер карточек турнира).

  Что делает вставка:
  1. монтирует слайдер карточек из бандла atlanty-schedule.js;
  2. поднимает официальный виджет записи VivaCRM отдельным инстансом «atlanty»
     в режиме попапа; типы занятий для попапа берутся из списка категорий;
  3. карточки — ссылки вида #atlanty&exerciseId=<id>, поэтому клик открывает
     запись на конкретное событие.

  КАТЕГОРИИ. Список ниже — единственное место, которое надо править, чтобы
  показывать другой набор расписаний. Менять его можно прямо в Tilda, без
  пересборки бандла. Нужны два id из Viva: направление (direction.id) и тип
  занятия (type.id) — тип нужен, чтобы попап записи видел это событие.
  Готовые пары:
    Атланты (корпоративные)   directionId 6152, typeId 2349, «Время Атланты»
    Время на друзей            directionId 5278, typeId 839,  «Время на друзей»
    Время на друзей (особый)   directionId 5280, typeId 1013, «Время на друзей»
    Патриоты                   появятся, когда направление создадут в Viva:
                               { directionId: <id>, typeId: <id>, label: "Время Патриотов" }
  Чтобы временно выключить категорию, не удаляя её: добавьте enabled: false.

  Перед публикацией:
  1. собрать бандл — `npx vite build --config vite.config.atlanty-schedule.ts`
     (он же входит в `npm run build:prod` / `build:dev:bundles`);
  2. выложить ОДИН файл `dist/atlanty-schedule.js` в `https://padlhub.su/lk/`
     (адресно: закреплённый standard frontend-комплект из 16 файлов его пока не
     включает, поэтому общий `deploy:prod` этот бандл не публикует);
  3. вставить этот блок в Tilda (T123) и опубликовать страницу.

  Загрузчик берёт версию из `/lk/release.json`; для уже выложенного файла смена
  версии ничего не ломает — версия работает как cache-bust, а сам бандл остаётся
  на месте.
-->
<div id="atlanty-schedule-root"></div>

<script>
  // Выбранные категории расписания. Порядок карточек — по дате события.
  var ATLANTY_CATEGORIES = [
    { directionId: 6152, typeId: 2349, label: "Время Атланты" },
    { directionId: 5278, typeId: 839, label: "Время на друзей" }
    // { directionId: 7000, typeId: 900, label: "Время Патриотов" },
  ];

  window.LK_ATLANTY_SCHEDULE_CONFIG = {
    categories: ATLANTY_CATEGORIES,
    // Необязательный заголовок над слайдером.
    title: "",
    // Сколько ближайших событий показывать всего.
    maxEvents: 24,
    // Сколько брать из каждой категории: не даёт плотной категории вытеснить
    // остальные (0 — выключить квоту и брать просто ближайшие maxEvents).
    maxPerCategory: 6,
    // Горизонт расписания в днях.
    daysAhead: 120,
    // Инстанс виджета записи Viva (ссылки карточек — #atlanty&exerciseId=…).
    vivaInstance: "atlanty",

    // --- Внешний вид (всё необязательное) ---
    // Сколько карточек в ряд: 0 — фиксированная ширина карточки (как в ЛК2),
    // 3–4 — «N в ряд», как в макете лендинга. Верхняя граница — 6.
    cardsPerView: 0,
    // Иконка в пилюле категории: "infinity" (по умолчанию) | "users" | "none".
    pillIcon: "infinity",
    // Фото тренера в футере: "photo" (по умолчанию) | "none".
    avatarMode: "photo",
    // Места: "segmented" — чип «1/8 | (+7 МЕСТ)» | "plain" — строкой «1/8 (+7 мест)».
    seatsStyle: "segmented",
    // Уровень: "meta" — строкой с иконкой | "chip" — отдельной плашкой.
    levelStyle: "meta"
  };
</script>

<script>
  // Вариант 1: подтянуть бандл витрины с нашего CDN.
  (function () {
    var primaryAssetOrigin = "https://padlhub.su";
    var scriptPath = "/lk/atlanty-schedule.js";
    var releasePath = "/lk/release.json";
    var releaseTimeoutMs = 5000;
    var scriptTimeoutMs = 12000;

    var cacheBust = String(Date.now()) + "-" + Math.random().toString(36).slice(2);
    var origin = primaryAssetOrigin.replace(/\/+$/, "");

    function showError() {
      var root = document.getElementById("atlanty-schedule-root");
      if (root) {
        root.innerHTML =
          "<div style='padding:16px;font-family:Arial,sans-serif;color:#333'>Не удалось загрузить расписание. Попробуйте позже.</div>";
      }
    }

    function addParam(src, key, value) {
      var url = new URL(src, window.location.href);
      url.searchParams.set(key, value);
      return url.toString();
    }

    function fetchWithTimeout(src, timeoutMs) {
      if (typeof AbortController === "undefined") return fetch(src, { cache: "no-store" });
      var controller = new AbortController();
      var timeoutId = setTimeout(function () { controller.abort(); }, timeoutMs);
      return fetch(src, { cache: "no-store", signal: controller.signal }).finally(function () {
        clearTimeout(timeoutId);
      });
    }

    function loadScript(version) {
      var script = document.createElement("script");
      var settled = false;
      var timeoutId = setTimeout(function () {
        settled = true;
        if (script.parentNode) script.parentNode.removeChild(script);
        showError();
      }, scriptTimeoutMs);

      script.id = "padlhub-atlanty-schedule-script";
      script.src = addParam(
        origin + scriptPath + (version ? "?v=" + encodeURIComponent(version) : ""),
        "force_ts",
        cacheBust
      );
      script.async = true;
      script.crossOrigin = "anonymous";
      script.onload = function () {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
      };
      script.onerror = function () {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        showError();
      };
      document.head.appendChild(script);
    }

    fetchWithTimeout(addParam(origin + releasePath, "force_ts", cacheBust), releaseTimeoutMs)
      .then(function (response) {
        if (!response.ok) throw new Error("release manifest unavailable");
        return response.json();
      })
      .then(function (release) {
        loadScript(release && release.version ? String(release.version) : null);
      })
      .catch(function () {
        loadScript(null);
      });
  })();
</script>

    }
    if (requestedExercise) initConfig.exerciseId = requestedExercise;

    w[o] = w[o] || function () { (w[o].q = w[o].q || []).push(arguments); };
    w[o].q = w[o].q || [];
    w.__vcGroupClassesInstances = w.__vcGroupClassesInstances || [];
    if (w.__vcGroupClassesInstances.indexOf(o) === -1) w.__vcGroupClassesInstances.push(o);
    w.__vcGroupClassesInstallScripts = w.__vcGroupClassesInstallScripts || {};

    var install = d.getElementById(o);
    if (!install) {
      install = d.createElement(s);

      install.type = "application/json";
      (d.body || d.documentElement).appendChild(install);
    }
    w.__vcGroupClassesInstallScripts[o] = install;

    // init обязан попасть в очередь раньше, чем бандл Viva выполнится.
    w[o]("init", initConfig);

    function boot() {
      if (typeof w.__vcGroupClassesBoot === "function") {

    var existing = d.querySelector('script[data-vc-group-classes-bundle="1"]');
    if (existing) {
      if (w.__vcGroupClassesBundleReady || existing.getAttribute("data-vc-group-classes-ready") === "1") {
        boot();
        return;
      }
      existing.addEventListener("load", boot);
      return;
    }

    var bundle = d.createElement(s);
    bundle.src = f;
    bundle.async = true;
    bundle.setAttribute("data-vc-group-classes-bundle", "1");
    bundle.onload = function () {
      bundle.setAttribute("data-vc-group-classes-ready", "1");

    };
    (d.body || d.head || d.documentElement).appendChild(bundle);
  })(window, document, "script", "atlanty", "https://cabinet.vivacrm.ru/vc-widget-group-classes.js");
