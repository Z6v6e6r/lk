    </div>
    <div id="atlanty-schedule-root"><p role="status">Загружаем расписание…</p></div>
  </section>

<script>
  (function () {
    if (window.__PH_PATRIOTS_SCHEDULE_LOADER_STARTED__) return;
    window.__PH_PATRIOTS_SCHEDULE_LOADER_STARTED__ = true;
    var origin = 'https://padlhub.su';
    var bust = Date.now() + '-' + Math.random().toString(36).slice(2);
    function error() {
      var root = document.getElementById('atlanty-schedule-root');
      if (root) root.innerHTML = '<p role="alert">Не удалось загрузить расписание. Попробуйте позже.</p>';
    }
    function load(version) {
      var script = document.createElement('script');
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; script.remove(); error(); } }, 12000);
      script.id = 'padlhub-patriots-schedule-script';
      script.src = origin + '/lk/atlanty-schedule.js?v=' + encodeURIComponent(version || bust) + '&force_ts=' + encodeURIComponent(bust);
      script.async = true;
      script.crossOrigin = 'anonymous';
      script.onload = function () { if (!done) { done = true; clearTimeout(timer); } };
      script.onerror = function () { if (!done) { done = true; clearTimeout(timer); error(); } };
      document.head.appendChild(script);
    }
    function start() {
      if (!document.getElementById('atlanty-schedule-root')) return error();
      var controller = typeof AbortController === 'function' ? new AbortController() : null;
      var timer = controller && setTimeout(function () { controller.abort(); }, 5000);
      fetch(origin + '/lk/release.json?force_ts=' + encodeURIComponent(bust),
        { cache: 'no-store', signal: controller ? controller.signal : undefined })
        .then(function (response) { if (!response.ok) throw new Error('manifest'); return response.json(); })
        .then(function (manifest) { load(manifest && manifest.version); })
        .catch(function () { load(null); })
        .finally(function () { if (timer) clearTimeout(timer); });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
    else start();
  })();
</script>
