<div id="root"></div>

<script>
  (function () {
    var assetOrigin = "https://padlhub.su";
    var url = new URL(window.location.href);
    var cacheBust = String(Date.now()) + "-" + Math.random().toString(36).slice(2);

    function isDevCabinetUrl(value) {
      var raw = String(value || "").trim();
      if (!raw) return false;
      try {
        return new URL(raw, window.location.origin).pathname.indexOf("/lk_dev") !== -1;
      } catch (_) {
        return raw.indexOf("/lk_dev") !== -1;
      }
    }

    function resolveChannel() {
      var explicitChannel = String(url.searchParams.get("channel") || "").trim().toLowerCase();
      if (explicitChannel === "dev" || explicitChannel === "prod") return explicitChannel;
      if (isDevCabinetUrl(url.searchParams.get("cabinetUrl"))) return "dev";
      if (isDevCabinetUrl(url.searchParams.get("returnUrl"))) return "dev";
      if (isDevCabinetUrl(document.referrer || "")) return "dev";
      return "prod";
    }

    var channel = resolveChannel();
    var scriptPath = channel === "dev" ? "/lk/games-dev.js" : "/lk/games.js";
    var releasePath = channel === "dev" ? "/lk/release-dev.json" : "/lk/release.json";
    var defaultCabinetUrl = channel === "dev" ? "https://padlhub.ru/lk_dev" : "https://padlhub.ru/lk_new";

    var data = {
      publicCreateEntry: true,
      presetStudioId: url.searchParams.get("stationId") || url.searchParams.get("studioId") || null,
      presetStudioName:
        url.searchParams.get("station") ||
        url.searchParams.get("stationName") ||
        url.searchParams.get("studio") ||
        url.searchParams.get("studioName") ||
        null,
      cabinetUrl: url.searchParams.get("cabinetUrl") || url.searchParams.get("returnUrl") || defaultCabinetUrl
    };

    function showError() {
      var root = document.getElementById("root");
      if (root) {
        root.innerHTML =
          "<div style='padding:16px;font-family:Arial,sans-serif;color:#333'>Не удалось загрузить создание игры. Попробуйте позже.</div>";
      }
    }

    function addParam(src, key, value) {
      var scriptUrl = new URL(src, window.location.href);
      scriptUrl.searchParams.set(key, value);
      return scriptUrl.toString();
    }

    function buildScriptUrl(version) {
      var src = assetOrigin + scriptPath;
      if (version) {
        window.__LK_RELEASE_VERSION__ = String(version);
        src = addParam(src, "v", String(version));
      }
      return addParam(src, "force_ts", cacheBust);
    }

    function mountWidget() {
      if (!window.LKWidgetGames || typeof window.LKWidgetGames.mount !== "function") {
        showError();
        return;
      }

      window.LKWidgetGames.mount({
        targetId: "root",
        onClose: function () {
          window.location.href = data.cabinetUrl || defaultCabinetUrl;
        },
        data: data
      });
    }

    function loadScript(version) {
      var old = document.getElementById("padlhub-games-create-script");
      if (old && old.parentNode) old.parentNode.removeChild(old);

      if (window.LKWidgetGames && typeof window.LKWidgetGames.unmount === "function") {
        window.LKWidgetGames.unmount("root");
      }
      window.LKWidgetGames = undefined;

      var script = document.createElement("script");
      script.id = "padlhub-games-create-script";
      script.src = buildScriptUrl(version);
      script.async = true;
      script.crossOrigin = "anonymous";
      script.onload = mountWidget;
      script.onerror = showError;
      document.head.appendChild(script);
    }

    fetch(addParam(assetOrigin + releasePath, "force_ts", cacheBust), {
      cache: "no-store",
      headers: {
        "Cache-Control": "no-cache, no-store, must-revalidate",
        "Pragma": "no-cache",
        "Expires": "0"
      }
    })
      .then(function (response) {
        if (!response.ok) throw new Error("release manifest unavailable");
        return response.json();
      })
      .then(function (release) {
        loadScript(release && release.version ? String(release.version) : null);
      })
      .catch(function () {
        loadScript(String(Date.now()));
      });
  })();
</script>
