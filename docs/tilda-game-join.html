<div id="root"></div>

<style>
  html,
  body {
    margin: 0 !important;
    background: #f5f5f7 !important;
  }

  #root {
    width: 100% !important;
    min-height: 100vh !important;
  }

  .t123,
  .t123 .t-container_100,
  .t123 .t-width_100 {
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }
</style>

<script>
  (function () {
    var primaryAssetOrigin = "https://padlhub.su";

    var scriptPath = "/lk/games.js";
    var releasePath = "/lk/release.json";
    var defaultCabinetUrl = "https://padlhub.ru/lk_new";

    var releaseTimeoutMs = 5000;
    var scriptTimeoutMs = 10000;

    var cacheBust = String(Date.now()) + "-" + Math.random().toString(36).slice(2);
    var url = new URL(window.location.href);

    function normalizeOrigin(value) {
      return String(value || "").trim().replace(/\/+$/, "");
    }

    function dedupeStrings(values) {
      var seen = {};
      return values.filter(function (value) {
        if (!value || seen[value]) return false;
        seen[value] = true;
        return true;
      });
    }

    var assetOrigins = dedupeStrings([normalizeOrigin(primaryAssetOrigin)].filter(Boolean));

    function buildLkBaseUrl(origin) {
      var normalized = normalizeOrigin(origin);
      return normalized ? normalized + "/lk" : null;
    }

    window.__LK_BASE_URLS__ = assetOrigins.map(buildLkBaseUrl).filter(Boolean);
    window.__LK_API_BASE_URLS__ = assetOrigins.slice();

    function hideTildaShell() {
      var root = document.getElementById("root");
      var currentRecord = root && root.closest ? root.closest(".t-rec") : null;

      var records = document.querySelectorAll("#allrecords > .t-rec");
      Array.prototype.forEach.call(records, function (record) {
        if (record !== currentRecord) {
          record.style.display = "none";
        }
      });

      var footer = document.getElementById("t-footer");
      if (footer) footer.style.display = "none";
    }

    hideTildaShell();
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", hideTildaShell);
    } else {
      hideTildaShell();
    }
    window.setTimeout(hideTildaShell, 0);
    window.setTimeout(hideTildaShell, 500);

    function readHashParam(key) {
      var hash = String(url.hash || "").replace(/^#/, "");
      if (!hash) return null;
      var idx = hash.indexOf("?");
      var hashParams = new URLSearchParams(idx >= 0 ? hash.slice(idx + 1) : hash);
      return hashParams.get(key);
    }

    var joinGameId =
      url.searchParams.get("joinGame") ||
      readHashParam("joinGame") ||
      url.searchParams.get("gameId") ||
      readHashParam("gameId") ||
      url.searchParams.get("id") ||
      readHashParam("id") ||
      "";

    var data = {
      joinGameId: String(joinGameId || "").trim() || null,
      cabinetUrl: url.searchParams.get("cabinetUrl") || url.searchParams.get("returnUrl") || defaultCabinetUrl
    };

    function showError(message) {
      var root = document.getElementById("root");
      if (root) {
        root.innerHTML =
          "<div style='padding:16px;font-family:Arial,sans-serif;color:#333'>" +
          (message || "Не удалось загрузить приглашение в игру. Попробуйте позже.") +
          "</div>";
      }
    }

    function addParam(src, key, value) {
      var scriptUrl = new URL(src, window.location.href);
      scriptUrl.searchParams.set(key, value);
      return scriptUrl.toString();
    }

    function buildReleaseUrl(origin) {
      return addParam(origin + releasePath, "force_ts", cacheBust);
    }

    function buildScriptUrl(origin, version) {
      var src = origin + scriptPath;
      if (version) {
        window.__LK_RELEASE_VERSION__ = String(version);
        src = addParam(src, "v", String(version));
      }
      return addParam(src, "force_ts", cacheBust);
    }

    function fetchWithTimeout(src, timeoutMs) {
      if (typeof AbortController === "undefined") {
        return fetch(src, {
          cache: "no-store"
        });
      }

      var controller = new AbortController();
      var timeoutId = setTimeout(function () {
        controller.abort();
      }, timeoutMs);

      return fetch(src, {
        cache: "no-store",
        signal: controller.signal
      }).finally(function () {
        clearTimeout(timeoutId);
      });
    }

    function mountWidget() {
      if (!data.joinGameId) {
        showError("Не передан идентификатор игры.");
        return;
      }

      if (!window.LKWidgetGames || typeof window.LKWidgetGames.mount !== "function") {
        showError();
        return;
      }

      window.LKWidgetGames.mount({
        targetId: "root",
        onClose: function () {
          window.location.href = data.cabinetUrl || defaultCabinetUrl;
        },
        data: data
      });
    }

    function cleanupPreviousWidget() {
      var old = document.getElementById("padlhub-game-join-script");
      if (old && old.parentNode) old.parentNode.removeChild(old);

      if (window.LKWidgetGames && typeof window.LKWidgetGames.unmount === "function") {
        window.LKWidgetGames.unmount("root");
      }

      window.LKWidgetGames = undefined;
    }

    function loadScriptFromCandidates(candidates, version, index) {
      if (index >= candidates.length) {
        showError();
        return;
      }

      cleanupPreviousWidget();

      var origin = candidates[index];
      var activeBaseUrl = buildLkBaseUrl(origin);
      if (activeBaseUrl) {
        window.__LK_ACTIVE_BASE_URL__ = activeBaseUrl;
      } else {
        delete window.__LK_ACTIVE_BASE_URL__;
      }
      var script = document.createElement("script");
      var settled = false;
      var timeoutId = setTimeout(function () {
        retry();
      }, scriptTimeoutMs);

      function retry() {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        loadScriptFromCandidates(candidates, version || String(Date.now()), index + 1);
      }

      script.id = "padlhub-game-join-script";
      script.src = buildScriptUrl(origin, version);
      script.async = true;
      script.crossOrigin = "anonymous";
      script.onload = function () {
        settled = true;
        clearTimeout(timeoutId);
        mountWidget();
      };
      script.onerror = retry;

      document.head.appendChild(script);
    }

    function fetchReleaseVersion(index) {
      if (index >= assetOrigins.length) {
        loadScriptFromCandidates(assetOrigins, String(Date.now()), 0);
        return;
      }

      var origin = assetOrigins[index];
      var releaseUrl = buildReleaseUrl(origin);

      fetchWithTimeout(releaseUrl, releaseTimeoutMs)
        .then(function (response) {
          if (!response.ok) throw new Error("release manifest unavailable");
          return response.json();
        })
        .then(function (release) {
          var version = release && release.version ? String(release.version) : null;
          var orderedOrigins = assetOrigins.slice(index).concat(assetOrigins.slice(0, index));
          loadScriptFromCandidates(orderedOrigins, version, 0);
        })
        .catch(function () {
          fetchReleaseVersion(index + 1);
        });
    }

    if (!data.joinGameId) {
      showError("Не передан идентификатор игры.");
      return;
    }

    fetchReleaseVersion(0);
  })();
</script>
