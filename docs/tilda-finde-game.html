<div id="root"></div>

<script>
  (function () {
    var assetOrigin = "https://padlhub.su";
    var scriptPath = "/lk/games.js";
    var releasePath = "/lk/release.json";
    var cabinetUrl = "https://padlhub.ru/lk_new";
    var url = new URL(window.location.href);

    var data = {
      publicFindEntry: true,
      presetStudioId: url.searchParams.get("stationId") || url.searchParams.get("studioId") || null,
      presetStudioName:
        url.searchParams.get("station") ||
        url.searchParams.get("stationName") ||
        url.searchParams.get("studio") ||
        url.searchParams.get("studioName") ||
        null,
      cabinetUrl: cabinetUrl
    };

    function showError() {
      var root = document.getElementById("root");
      if (root) {
        root.innerHTML =
          "<div style='padding:16px;font-family:Arial,sans-serif;color:#333'>Не удалось загрузить поиск игр. Попробуйте позже.</div>";
      }
    }

    function withVersion(src, version) {
      var scriptUrl = new URL(src, window.location.href);
      scriptUrl.searchParams.set("v", version || String(Date.now()));
      return scriptUrl.toString();
    }

    function mountWidget() {
      if (!window.LKWidgetGames || typeof window.LKWidgetGames.mount !== "function") {
        showError();
        return;
      }

      window.LKWidgetGames.mount({
        targetId: "root",
        onClose: function () {
          window.location.href = cabinetUrl;
        },
        data: data
      });
    }

    function loadScript(version) {
      if (window.LKWidgetGames && typeof window.LKWidgetGames.unmount === "function") {
        window.LKWidgetGames.unmount("root");
      }
      window.LKWidgetGames = undefined;

      var script = document.createElement("script");
      script.src = withVersion(assetOrigin + scriptPath, version);
      script.async = true;
      script.crossOrigin = "anonymous";
      script.onload = mountWidget;
      script.onerror = showError;
      document.head.appendChild(script);
    }

    fetch(withVersion(assetOrigin + releasePath, String(Date.now())), { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("release manifest unavailable");
        return response.json();
      })
      .then(function (release) {
        loadScript(release && release.version);
      })
      .catch(function () {
        loadScript(String(Date.now()));
      });
  })();
</script>
