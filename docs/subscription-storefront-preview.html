<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Подписки — локальная проверка</title></head>
<body style="margin:0">
  <aside style="padding:12px;font:14px sans-serif;background:#fff3ce">Локальный макет · демонстрационные цены и остатки · покупки отключены
    <button id="unmount" type="button">Размонтировать</button>
    <button id="mount" type="button">Смонтировать</button>
    <label>Ширина блока <select id="width"><option value="100%">Вся страница</option><option value="375px">375 px</option><option value="768px">768 px</option></select></label>
  </aside>
  <div id="padlhub-subscriptions" style="max-width:100%;margin:auto"></div>
  <script type="module">
    import { summerPlanPresentation, friendshipVariantBenefits } from '../src/components/subscription-storefront/presentation.ts';
    import { friendshipBillingOptions } from '../src/components/subscription-storefront/catalog.ts';
    import markUrl from '../src/components/subscription-storefront/assets/brand/подписка.svg';
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = '../dist/subscription-storefront/subscription-storefront.js?force_ts=' + Date.now();
      script.onload = resolve;
      script.onerror = reject;
      document.head.append(script);
    });
    const reference = new URLSearchParams(location.search).get('reference') === 'figma';
    const view = { id: 'local-preview', title: 'Играй в падел выгодно', description: 'Выберите подписку под свой ритм игры', markUrl,
      sections: [{ id: 'monthly', plans: ['friendship','ra','academy'].map((id, index) => ({
        ...summerPlanPresentation[id], id, ctaLabel: 'Демонстрация · покупка отключена', ctaDisabled: true,
        billingOptions: id === 'friendship' ? friendshipBillingOptions([{ counterKey: 'friendship', priceMinor: 980000, canPurchase: false, bindingReady: true, unlimited: true, remainingCount: 0, totalLimit: 0 }, { counterKey: 'network_friendship', priceMinor: 9800000, canPurchase: false, bindingReady: true, unlimited: false, remainingCount: 10, totalLimit: 10 }]).map(option => ({ ...option, benefitGroups: friendshipVariantBenefits[option.id] })) : [{ id: 'monthly', label: '30 дней', priceSuffix: '/ 30 дней', priceMinor: index ? 2380000 : 980000,
          ...(id === 'ra' ? { progress: { current: 12, total: 100, label: 'Доступно' } } : {}) }],
      })) }] };
    if (reference) {
      view.description = 'Какой-то небольшой абзац текста про выгоду подписок';
      for (const plan of view.sections[0].plans) {
        plan.ctaDisabled = false;
        plan.ctaLabel = 'Оформить подписку';
        plan.billingOptions = [{ id: 'monthly', label: 'Месячная', priceSuffix: '/ мес.',
          priceMinor: plan.id === 'friendship' ? 980000 : 2380000,
          ...(plan.id === 'ra' ? { progress: { current: 12, total: 100, label: 'Доступно' } } : {}) }];
        if (plan.id === 'friendship') plan.billingOptions.push({ id: 'annual', label: 'Годовая', priceMinor: null, ctaDisabled: true });
      }
    }
    const mount = () => window.LKWidgetSubscriptionStorefront.mount({ data: { previewView: view } });
    document.getElementById('unmount').onclick = () => window.LKWidgetSubscriptionStorefront.unmount();
    document.getElementById('mount').onclick = mount;
    document.getElementById('width').onchange = event => { document.getElementById('padlhub-subscriptions').style.width = event.target.value; };
    mount();
  </script>
</body>
</html>
