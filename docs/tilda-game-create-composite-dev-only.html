<div id="root"></div>

<script>
  (function () {
    var assetOrigin = "https://lk-reserve.89-108-64-209.sslip.io";
    var url = new URL(window.location.href);
    var releaseTimeoutMs = 5000;
    var scriptTimeoutMs = 10000;
    var cacheBust = String(Date.now()) + "-" + Math.random().toString(36).slice(2);
    var defaultCabinetUrl = "https://padlhub.ru/lk_dev";

    window.__LK_BASE_URLS__ = [assetOrigin + "/lk"];
    window.__LK_API_BASE_URLS__ = [assetOrigin];

    var data = {
      compositeCreateEntry: true,
      presetStudioId: url.searchParams.get("stationId") || url.searchParams.get("studioId") || null,
      presetStudioName:
        url.searchParams.get("station") ||
        url.searchParams.get("stationName") ||
        url.searchParams.get("studio") ||
        url.searchParams.get("studioName") ||
        null,
      cabinetUrl: url.searchParams.get("cabinetUrl") || url.searchParams.get("returnUrl") || defaultCabinetUrl
    };

    function showError() {
      var root = document.getElementById("root");
      if (root) {
        root.innerHTML =
          "<div style='padding:16px;font-family:Arial,sans-serif;color:#333'>Не удалось загрузить dev-версию составной записи. Попробуйте позже.</div>";
      }
    }

    function addParam(src, key, value) {
      var scriptUrl = new URL(src, window.location.href);
      scriptUrl.searchParams.set(key, value);
      return scriptUrl.toString();
    }

    function fetchWithTimeout(src, timeoutMs) {
      if (typeof AbortController === "undefined") {
        return fetch(src, {
          cache: "no-store"
        });
      }

      var controller = new AbortController();
      var timeoutId = setTimeout(function () {
        controller.abort();
      }, timeoutMs);

      return fetch(src, {
        cache: "no-store",
        signal: controller.signal
      }).finally(function () {
        clearTimeout(timeoutId);
      });
    }

    function mountWidget() {
      if (!window.LKWidgetGames || typeof window.LKWidgetGames.mount !== "function") {
        showError();
        return;
      }

      window.LKWidgetGames.mount({
        targetId: "root",
        onClose: function () {
          window.location.href = data.cabinetUrl || defaultCabinetUrl;
        },
        data: data
      });
    }

    function cleanupPreviousWidget() {
      var old = document.getElementById("padlhub-games-composite-create-dev-script");
      if (old && old.parentNode) old.parentNode.removeChild(old);

      if (window.LKWidgetGames && typeof window.LKWidgetGames.unmount === "function") {
        window.LKWidgetGames.unmount("root");
      }

      window.LKWidgetGames = undefined;
    }

    function loadScript(version) {
      cleanupPreviousWidget();
      window.__LK_ACTIVE_BASE_URL__ = assetOrigin + "/lk";

      var script = document.createElement("script");
      var settled = false;
      var timeoutId = setTimeout(function () {
        fail();
      }, scriptTimeoutMs);

      function fail() {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        if (script.parentNode) script.parentNode.removeChild(script);
        showError();
      }

      script.id = "padlhub-games-composite-create-dev-script";
      script.src = addParam(
        addParam(assetOrigin + "/lk/games-dev.js", "v", version || String(Date.now())),
        "force_ts",
        cacheBust
      );
      script.async = true;
      script.crossOrigin = "anonymous";
      script.onload = function () {
        settled = true;
        clearTimeout(timeoutId);
        mountWidget();
      };
      script.onerror = fail;

      document.head.appendChild(script);
    }

    fetchWithTimeout(addParam(assetOrigin + "/lk/release-dev.json", "force_ts", cacheBust), releaseTimeoutMs)
      .then(function (response) {
        if (!response.ok) throw new Error("release manifest unavailable");
        return response.json();
      })
      .then(function (release) {
        var version = release && release.version ? String(release.version) : null;
        window.__LK_RELEASE_VERSION__ = version || null;
        loadScript(version);
      })
      .catch(function () {
        loadScript(String(Date.now()));
      });
  })();
</script>
