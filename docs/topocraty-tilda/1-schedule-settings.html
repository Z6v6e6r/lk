<!--
  Tilda, блок T123 «HTML-код» — НАСТРОЙКИ ВИТРИНЫ РАСПИСАНИЯ.

  Ставится ОДИН раз на странице (или один раз на весь сайт — см. README.md),
  обязательно выше блока с самой витриной. Скриптов здесь нет, только данные:
  этот блок можно спокойно править руками.

  Что менять:
  - ATLANTY_CATEGORIES — какие расписания показывать (directionId/typeId из Viva,
    label — пилюля на карточке, badge — бейдж на шапке, enabled: false — выключить);
  - maxEvents / maxPerCategory / daysAhead — сколько и насколько вперёд показывать;
  - cardsPerView, pillIcon, avatarMode, seatsStyle, levelStyle, detailModal —
    внешний вид и поведение карточки;
  - images / imagePick — фото на шапке карточки.
-->
<script>
  // Выбранные категории расписания. Порядок карточек — по дате события.
  // Категории страницы Топократов — направления Viva:
  //   6180 «Топократы игра»         — по подписке «Дружба Топократы»;
  //   6233 «Топократы тренировка»   — разовая 4 000 ₽ или по подписке с доплатой.
  // Тип у обоих 2349 «Корпоративные клиенты»: он нужен попапу записи, чтобы
  // витрина видела эти события. Направление — основной признак, поэтому
  // события другого клуба с тем же типом сюда не попадут.
  var ATLANTY_CATEGORIES = [
    {
      directionId: 6180,
      typeId: 2349,
      label: "Топократы игра",
      badge: "По подписке «Дружба»"
    },
    {
      directionId: 6233,
      typeId: 2349,
      label: "Топократы тренировка",
      badge: "4 000 ₽ или с доплатой"
    }
  ];

  window.LK_ATLANTY_SCHEDULE_CONFIG = {
    categories: ATLANTY_CATEGORIES,
    // Необязательный заголовок над слайдером.
    title: "",
    // Сколько ближайших событий показывать всего.
    maxEvents: 24,
    // Сколько брать из каждой категории: не даёт плотной категории вытеснить
    // остальные (0 — выключить квоту и брать просто ближайшие maxEvents).
    maxPerCategory: 6,
    // Горизонт расписания в днях.
    daysAhead: 120,
    // Инстанс виджета записи Viva (ссылки карточек — #atlanty&exerciseId=…).
    vivaInstance: "atlanty",

    // --- Внешний вид (всё необязательное) ---
    // Сколько карточек в ряд: 0 — фиксированная ширина карточки (как в ЛК2),
    // 3–4 — «N в ряд», как в макете лендинга. Верхняя граница — 6.
    // 3 в ряд — как сетка .ph-tk-events__grid; на мобильном останется слайдер.
    cardsPerView: 3,
    // Иконка в пилюле категории: "infinity" (по умолчанию) | "users" | "none".
    pillIcon: "infinity",
    // Фото тренера в футере: "photo" (по умолчанию) | "none".
    avatarMode: "photo",
    // Места: "segmented" — чип «1/8 | (+7 МЕСТ)» | "plain" — строкой «1/8 (+7 мест)».
    seatsStyle: "segmented",
    // Уровень: "meta" — строкой с иконкой | "chip" — отдельной плашкой.
    levelStyle: "meta",
    // Клик по карточке открывает карточку события с кнопкой «Записаться».
    detailModal: true,
    // Фото на шапке: "shuffle" — перемешать клубный набор при загрузке
    // (стабильно при листании) | "hash" — стабильно по id события, как в LK2.
    imagePick: "shuffle"
    // images: ["https://…/photo-1.webp", "https://…/photo-2.webp"] — свой пул
  };
</script>
