name: Telegram reactivation offline checks

on:
  pull_request:
    paths:
      - scripts/telegram_reactivation/**
      - scripts/tests/telegramReactivation*
      - docs/TELEGRAM_REACTIVATION.md
      - .github/workflows/telegram-reactivation.yml

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node --test scripts/tests/telegramReactivation.test.mjs scripts/tests/telegramReactivationCloud.test.mjs
      - run: python3 scripts/tests/telegramReactivationAudience.test.py
