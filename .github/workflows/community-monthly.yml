name: Community monthly MongoDB integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/services/community-rating/**"
      - "scripts/community_monthly_worker.mjs"
      - "scripts/community_monthly_reports.mjs"
      - "scripts/build_rating_worker_release.mjs"
      - "scripts/lib/stationMembership*.mjs"
      - "scripts/lib/communityRosterWrites.mjs"
      - "scripts/lib/communityPolicyProjection.mjs"
      - "scripts/lib/communityResponseRedaction.mjs"
      - "scripts/nodered_station_membership_nodes/**"
      - "scripts/patch_nodered_station_membership_owner.mjs"
      - "scripts/patch_nodered_communities_flow.mjs"
      - "scripts/tests/stationMembership*"
      - "scripts/tests/helpers/stationMembershipOwnerHarness.mjs"
      - "scripts/lib/communityMonthlyFinalization.mjs"
      - "scripts/nodered_community_monthly_nodes/**"
      - "scripts/patch_nodered_community_monthly_flow.mjs"
      - "scripts/tests/communityMonthly*"
      - "scripts/nodered_managed_self_leave_nodes/**"
      - "scripts/nodered_games_nodes/fn_split_leave_*.js"
      - "scripts/lib/managedSelfLeaveOwnerSource.mjs"
      - "scripts/patch_nodered_managed_self_leave_owner.mjs"
      - "scripts/tests/managedSelfLeaveOwner*"
      - "scripts/tests/helpers/managedSelfLeaveOwnerHarness.mjs"
      - "scripts/tests/fixtures/managed-self-leave-v1-contract.json"
      - "deploy/rating-worker/**"
      - "package*.json"
      - ".github/workflows/community-monthly.yml"
  push:
    branches: [main]
    paths:
      - "src/services/community-rating/**"
      - "scripts/community_monthly_worker.mjs"
      - "scripts/community_monthly_reports.mjs"
      - "scripts/build_rating_worker_release.mjs"
      - "scripts/nodered_community_monthly_nodes/**"
      - "scripts/patch_nodered_community_monthly_flow.mjs"
      - "scripts/tests/communityMonthly*"
      - "scripts/nodered_managed_self_leave_nodes/**"
      - "scripts/nodered_games_nodes/fn_split_leave_*.js"
      - "scripts/lib/managedSelfLeaveOwnerSource.mjs"
      - "scripts/patch_nodered_managed_self_leave_owner.mjs"
      - "scripts/tests/managedSelfLeaveOwner*"
      - "scripts/tests/helpers/managedSelfLeaveOwnerHarness.mjs"
      - "scripts/tests/fixtures/managed-self-leave-v1-contract.json"
      - "scripts/lib/stationMembership*.mjs"
      - "scripts/lib/communityRosterWrites.mjs"
      - "scripts/lib/communityPolicyProjection.mjs"
      - "scripts/lib/communityResponseRedaction.mjs"
      - "scripts/nodered_station_membership_nodes/**"
      - "scripts/patch_nodered_station_membership_owner.mjs"
      - "scripts/patch_nodered_communities_flow.mjs"
      - "scripts/tests/stationMembership*"
      - "scripts/tests/helpers/stationMembershipOwnerHarness.mjs"
      - "scripts/lib/communityMonthlyFinalization.mjs"
      - "deploy/rating-worker/**"
      - "package*.json"
      - ".github/workflows/community-monthly.yml"

permissions:
  contents: read

concurrency:
  group: community-monthly-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monthly-mongodb:
    # MongoDB 8.0 refuses Linux >=6.19 (SERVER-121912); keep this test on the
    # Ubuntu 22.04 runner's 6.8 kernel. Revisit when MongoDB supports newer kernels
    # and before runner retirement: actions/runner-images#14254.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      COMMUNITY_MONTHLY_TEST_MONGO_URI: mongodb://127.0.0.1:27017
      TZ: Europe/Moscow
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Exact parent-source custody fixtures read immutable predecessor commits.
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --include=optional --no-audit --no-fund
      - name: Test calendar rating, public routes and real Mongo write conflicts
        run: npm run test:community-monthly
      - name: Test managed SELF owner admission with real Mongo write conflicts
        run: node --test scripts/tests/managedSelfLeaveOwner.test.mjs scripts/tests/managedSelfLeaveOwnerPatch.test.mjs scripts/tests/managedSelfLeaveOwner.mongo.test.mjs
      - name: Test station membership lifecycle, receiver and physical Mongo races
        run: |
          node --test scripts/tests/stationMembershipLifetime.test.mjs scripts/tests/stationMembershipOwner.test.mjs scripts/tests/stationMembershipOwnerPatch.test.mjs scripts/tests/stationMembershipOwnerMongo.test.mjs
          node --experimental-strip-types --test scripts/tests/communityTypes.test.ts
      - name: Test worker release and schedule wrappers
        run: npm run test:rating-worker-release
