name: CUP-only player level
on:
  pull_request:
    paths:
      - 'src/utils/apiClient.ts'
      - 'src/utils/playerLevel.ts'
      - 'src/services/player-rating/**'
      - 'scripts/*cup*level*'
      - 'scripts/lib/cup*.mjs'
      - 'scripts/nodered_player_level_nodes/**'
      - 'scripts/tests/cupPlayerLevel*'
      - 'package.json'
      - '.github/workflows/cup-only-player-level.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.13.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -b
      - run: npm run test:cup-only-level
