name: LK1 Subscription Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lk1-subscription-enforcement-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lk1-exact-head:
    name: LK1 exact-head enforcement gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      TZ: "Europe/Moscow"

    steps:
      - name: Checkout exact pull-request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Checkout exact push SHA
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Resolve pull-request immutable identity
        id: pr_identity
        if: github.event_name == 'pull_request'
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$EVENT_BASE_SHA"
          test -n "$EVENT_HEAD_SHA"
          {
            printf 'BASE_SHA=%s\n' "$EVENT_BASE_SHA"
            printf 'EXPECTED_HEAD_SHA=%s\n' "$EVENT_HEAD_SHA"
            printf 'DIFF_RANGE=%s...%s\n' "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA"
          } >> "$GITHUB_ENV"
          {
            printf 'head_sha=%s\n' "$EVENT_HEAD_SHA"
            printf 'diff_range=%s...%s\n' "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve push immutable identity
        id: push_identity
        if: github.event_name == 'push'
        env:
          EVENT_BASE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$EVENT_BASE_SHA"
          test -n "$EVENT_HEAD_SHA"
          {
            printf 'BASE_SHA=%s\n' "$EVENT_BASE_SHA"
            printf 'EXPECTED_HEAD_SHA=%s\n' "$EVENT_HEAD_SHA"
            printf 'DIFF_RANGE=%s..%s\n' "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA"
          } >> "$GITHUB_ENV"
          {
            printf 'head_sha=%s\n' "$EVENT_HEAD_SHA"
            printf 'diff_range=%s..%s\n' "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Verify checkout identity and diff endpoints
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          test -n "$EXPECTED_HEAD_SHA"
          test -n "$DIFF_RANGE"
          git cat-file -e "$BASE_SHA^{commit}"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "Exact-head checkout mismatch" >&2
            exit 1
          fi
          echo "base_sha=$BASE_SHA"
          echo "expected_head_sha=$EXPECTED_HEAD_SHA"
          echo "checked_out_sha=$checked_out_sha"
          echo "diff_range=$DIFF_RANGE"

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Record immutable job identity
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          checked_out_tree="$(git rev-parse HEAD^{tree})"
          {
            echo "## LK1 exact-head identity"
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Base SHA: \`$BASE_SHA\`"
            echo "- Expected head SHA: \`$EXPECTED_HEAD_SHA\`"
            echo "- Checked-out SHA: \`$checked_out_sha\`"
            echo "- Checked-out tree: \`$checked_out_tree\`"
            echo "- Node: \`$(node --version)\`"
            echo "- npm: \`$(npm --version)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check exact event diff whitespace
        env:
          GIT_NO_REPLACE_OBJECTS: "1"
          IMMUTABLE_DIFF_RANGE: ${{ steps.pr_identity.outputs.diff_range || steps.push_identity.outputs.diff_range }}
        run: git diff --check --no-ext-diff --no-textconv "$IMMUTABLE_DIFF_RANGE"

      - name: Scan changed paths for secrets, PII, binaries, and runtime artifacts
        env:
          GIT_NO_REPLACE_OBJECTS: "1"
          IMMUTABLE_HEAD_SHA: ${{ steps.pr_identity.outputs.head_sha || steps.push_identity.outputs.head_sha }}
          IMMUTABLE_DIFF_RANGE: ${{ steps.pr_identity.outputs.diff_range || steps.push_identity.outputs.diff_range }}
        run: |
          set -euo pipefail
          test -n "$IMMUTABLE_HEAD_SHA"
          test -n "$IMMUTABLE_DIFF_RANGE"
          scan_checkout_sha="$(git rev-parse HEAD)"
          if [[ "$scan_checkout_sha" != "$IMMUTABLE_HEAD_SHA" ]]; then
            echo "Exact-head checkout drifted before custody scan" >&2
            exit 1
          fi
          if [[ -n "$(git status --short --untracked-files=no)" ]]; then
            echo "Tracked files changed before custody scan" >&2
            git status --short --untracked-files=no >&2
            exit 1
          fi
          git diff --name-only --no-renames --diff-filter=AM -z --no-ext-diff --no-textconv \
            "$IMMUTABLE_DIFF_RANGE" \
            > "$RUNNER_TEMP/lk1-changed-paths.z"
          if ! git check-attr --stdin -z diff < "$RUNNER_TEMP/lk1-changed-paths.z" \
            | node --input-type=module -e '
              let input = Buffer.alloc(0);
              process.stdin.on("data", (chunk) => { input = Buffer.concat([input, chunk]); });
              process.stdin.on("end", () => {
                const fields = input.toString("utf8").split("\0");
                for (let index = 0; index + 2 < fields.length; index += 3) {
                  const [path, attribute, value] = fields.slice(index, index + 3);
                  if (attribute !== "diff" || value !== "unspecified") {
                    process.stderr.write(`Git diff attribute override is forbidden: ${path}\n`);
                    process.exitCode = 1;
                  }
                }
              });
            '; then
            exit 1
          fi
          node --input-type=module -e '
            let input = Buffer.alloc(0);
            process.stdin.on("data", (chunk) => { input = Buffer.concat([input, chunk]); });
            process.stdin.on("end", () => {
              for (const path of input.toString("utf8").split("\0")) {
                if (!path) continue;
                if (/[\u0000-\u001f\u007f]/u.test(path)) {
                  process.stderr.write(`Control characters in changed path are forbidden: ${JSON.stringify(path)}\n`);
                  process.exitCode = 1;
                  continue;
                }
                process.stdout.write(`${path}\n`);
              }
            });
          ' < "$RUNNER_TEMP/lk1-changed-paths.z" > "$RUNNER_TEMP/lk1-changed-paths.txt"
          : > "$RUNNER_TEMP/lk1-unexpected-binary-paths.txt"
          while IFS= read -r -d '' changed_path; do
            expected_hash=""
            case "$changed_path" in
              src/assets/piter-subscription-rules-from-20260901.webp)
                expected_hash="3e5ad8e71c42c8e46ea6cc9bfb6f0539dd09181f940c022a8956b35172ff9c12"
                ;;
              src/assets/piter-subscription-tier-1.webp)
                expected_hash="21868451f8dd722a99db1a555065e00bae401e2592c19a2e38e21fadcd2d590d"
                ;;
              src/assets/network-subscription.webp)
                expected_hash="83a8f2ccf39908a6cbe7b5692598fdd1624a9d0a03784cb8a6815fd69b276ef6"
                ;;
              src/assets/subscription-rules-gold.webp)
                expected_hash="cfa623d31076199d30b2b62149744d9845fb975f3686b681641a461eac8f2358"
                ;;
              src/assets/subscription-rules-green.webp)
                expected_hash="ab879147110a73dab69a196de9370fff912d009941e59a8a52ce4e89e78e617c"
                ;;
              src/assets/subscription-rules-red.webp)
                expected_hash="f3a9a3077865eac4cc3fb6a7be1c4f64a174795f9fefa1dfa8341ada5f2e313c"
                ;;
              src/assets/summer-subscription-academy.webp)
                expected_hash="1b7bdb5cf0c1f03847efac7ddf7cb9b7142187293a0d5a82190c61a79841847a"
                ;;
              src/assets/summer-subscription-energy5.webp)
                expected_hash="773ab011fb41d7d27ca389adfd741cefb9d8a34ac8afbf60beb307d7b514d9ba"
                ;;
              src/assets/summer-subscription-friendship.webp)
                expected_hash="1ec1f7fc81cd867b9ce7127ff3b03e7ee33250224bceea7bebde89dc5703ec29"
                ;;
              src/assets/summer-subscription-ra.webp)
                expected_hash="5f89f2f44ea1cd1d2fd1e36b8fb39a2cb6dbd9d525380b0f4d588a2139142329"
                ;;
            esac
            if [[ -n "$expected_hash" ]]; then
              if ! git cat-file -e "$IMMUTABLE_HEAD_SHA:$changed_path"; then
                echo "Allowlisted binary is absent from the exact Git tree: $changed_path" >&2
                exit 1
              fi
              actual_hash="$(git cat-file blob "$IMMUTABLE_HEAD_SHA:$changed_path" | sha256sum | awk '{ print $1 }')"
              if [[ "$actual_hash" != "$expected_hash" ]]; then
                echo "Allowlisted binary hash mismatch: $changed_path" >&2
                exit 1
              fi
              continue
            fi
            if ! git cat-file blob "$IMMUTABLE_HEAD_SHA:$changed_path" \
              | node --input-type=module -e '
                let inspected = 0;
                let binary = false;
                process.stdin.on("data", (chunk) => {
                  const remaining = Math.max(0, 8000 - inspected);
                  if (remaining > 0 && chunk.subarray(0, remaining).includes(0)) binary = true;
                  inspected += Math.min(remaining, chunk.length);
                });
                process.stdin.on("end", () => { process.exitCode = binary ? 1 : 0; });
              '; then
              printf '%s\n' "$changed_path" >> "$RUNNER_TEMP/lk1-unexpected-binary-paths.txt"
            fi
          done < "$RUNNER_TEMP/lk1-changed-paths.z"
          if [[ -s "$RUNNER_TEMP/lk1-unexpected-binary-paths.txt" ]]; then
            echo "Unexpected binary files in event diff:" >&2
            sed -n '1,80p' "$RUNNER_TEMP/lk1-unexpected-binary-paths.txt" >&2
            exit 1
          fi
          if grep -E '(^|/)\.gitattributes$|(^|/)(dist|build|node-red/modular)(/|$)|(^|/)release[^/]*\.json$|\.(env|har|pem|key|p12|pfx|zip|tar|tgz|gz|7z|png|jpe?g|gif|pdf)$' \
            "$RUNNER_TEMP/lk1-changed-paths.txt" > "$RUNNER_TEMP/lk1-forbidden-paths.txt"; then
            echo "Unexpected generated, runtime, credential, or binary artifact paths:" >&2
            sed -n '1,80p' "$RUNNER_TEMP/lk1-forbidden-paths.txt" >&2
            exit 1
          fi
          git diff --unified=0 --no-color --no-ext-diff --no-textconv "$IMMUTABLE_DIFF_RANGE" \
            | node --input-type=module -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const added = input.split("\n").filter((line) => line.startsWith("+") && !line.startsWith("+++"));
                const patterns = [
                  ["private-key", /BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY/],
                  ["github-token", /\bgh[opsu]_[A-Za-z0-9]{30,}\b/],
                  ["bearer-token", /Bearer\s+[A-Za-z0-9._-]{20,}/i],
                  ["jwt", /\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b/],
                  ["email", /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/],
                  ["phone", new RegExp(["(?<![A-Fa-f0-9])(?:\\+7|8)", "[ -]?\\(?\\d{3}\\)?", "[ -]?\\d{3}[ -]?\\d{2}[ -]?\\d{2}(?![A-Fa-f0-9])"].join(""))],
                ];
                const findings = [];
                added.forEach((line, index) => {
                  for (const [label, pattern] of patterns) {
                    if (pattern.test(line)) findings.push(`${label} at added-line ${index + 1}`);
                  }
                });
                if (findings.length > 0) {
                  console.error("Potential secret or PII patterns detected (values redacted):");
                  findings.slice(0, 80).forEach((finding) => console.error(finding));
                  process.exitCode = 1;
                }
              });
            '

      - name: Install locked dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Confirm dependency install kept tracked files clean
        run: |
          set -euo pipefail
          if [[ -n "$(git status --short --untracked-files=no)" ]]; then
            echo "npm ci modified tracked files" >&2
            git status --short --untracked-files=no
            exit 1
          fi

      - name: Validate LK1 workflow event and identity contract
        run: node --test scripts/tests/lk1SubscriptionEnforcementWorkflow.test.mjs

      - name: Run critical subscription regression matrix
        run: >-
          node --experimental-strip-types --test
          scripts/tests/subscriptionBookingGateway.nodered.test.ts
          scripts/tests/managedSubscriptionPolicyEvaluator.nodered.test.ts
          scripts/tests/subscriptionSharedDailyLimit.test.ts
          scripts/tests/subscriptionCategoryDailyLimit.test.ts
          scripts/tests/subscriptionDailyLimit.test.ts
          scripts/tests/splitRouter.transactionAndSubscription.test.ts
          scripts/tests/splitRouter.dailyLimit.test.ts
          scripts/tests/splitLeave.router.test.ts
          scripts/tests/legacyRosterBridge.nodered.test.ts
          scripts/tests/gamesPatchCancelGuard.test.ts
          scripts/tests/gamesPatchRecovery.test.mjs
          scripts/tests/splitPaymentOccupancy.test.ts
          scripts/tests/tournamentSubscription.summer.nodered.test.ts
          scripts/tests/tournamentSubscriptionSalesCandidate.test.mjs
          scripts/tests/tournamentSignupAvailability.test.ts
          scripts/tests/tournamentSignupVivaBookingIdentity.test.ts
          scripts/tests/groupScheduleApi.test.ts

      - name: Run unified candidate and drift-negative tests
        run: >-
          node --test
          scripts/tests/lk1SubscriptionEnforcementCandidate.test.mjs
          scripts/tests/piterAtomicTopologyContract.test.mjs
          scripts/tests/lk1SubscriptionActivationPacket.test.mjs
          scripts/tests/lk1SubscriptionDevCandidate.test.mjs
          scripts/tests/subscriptionBookingLegacyPatcher.test.mjs

      - name: Validate LK1 DEV provisioning, bootstrap, runtime source, and read-only UAT
        run: >-
          node --test
          scripts/tests/lk1SubscriptionDevProvisioning.test.mjs
          scripts/tests/lk1SubscriptionDevBootstrap.test.mjs
          scripts/tests/lk1SubscriptionDevRuntimeSource.test.mjs
          scripts/tests/lk1SubscriptionDevReleaseReceipt.test.mjs
          scripts/tests/lk1SubscriptionDevRuntimeInstallCandidate.test.mjs
          scripts/tests/lk1SubscriptionDevDeployPostcheckGate.test.mjs
          scripts/tests/lk1SubscriptionDevHostPreflight.test.mjs
          scripts/dev-uat/subscriptions-sale-period/test.mjs

      - name: Run tracked credential and authenticated-route security tests
        run: >-
          node --test
          scripts/tests/vivaServiceCredentialResolution.security.test.mjs
          scripts/tests/subscriptionBookingNginx.test.mjs

      - name: Run Partner membership R4 gates
        run: |
          npm run test:partner-game-membership-api
          npm run validate:partner-game-membership-runtime
          npm run validate:partner-game-membership-production-controls

      - name: Run Piter atomic activation lock and ledger gates
        run: npm run test:piter-atomic-activation

      - name: Validate deterministic Node-RED modular toolchain fixtures
        run: node --test scripts/tests/noderedModularToolchain.test.mjs

      - name: Validate combined legacy game command prerequisites
        run: npm run test:legacy-game-command-prerequisites

      - name: Validate combined split draft persistence
        run: >-
          node --experimental-strip-types --test
          scripts/tests/paymentSyncDraftRecovery.test.ts
          scripts/tests/serverGameDraftPersistence.test.ts
          scripts/tests/gamePaymentConfirmation.nodered.test.ts
          scripts/tests/splitLifecycleV2.nodered.test.ts

      - name: Validate referral attribution compatibility
        run: >-
          node --experimental-strip-types --test
          scripts/tests/referralAttribution.test.ts
          scripts/tests/referralSubscription.nodered.test.ts
          scripts/tests/referralAttributionReleaseCandidate.test.mjs

      - name: Fetch pinned legacy build image
        run: docker pull node@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a

      - name: Validate reviewed-flow and legacy custody boundaries
        run: >-
          node --test --test-concurrency=1
          scripts/tests/reviewedFlowDeploy.test.mjs
          scripts/tests/legacyGameCommandProductionRelease.test.mjs
          scripts/tests/legacyGameCommandH2IdentityAudit.test.mjs
          scripts/tests/legacyGameCommandRootAclBootstrap.test.mjs

      - name: Typecheck
        run: npx tsc -b --pretty false

      - name: Lint
        run: npm run lint

      - name: Export inert build environment
        run: >-
          node --input-type=module -e '
          import fs from "node:fs";
          import { REQUIRED_BUILD_ENV_KEYS } from "./scripts/lib/build-env.mjs";
          const lines = REQUIRED_BUILD_ENV_KEYS.map((key) => {
            if (key === "VITE_TENANT_KEY") return `${key}=ci`;
            const normalized = key.toLowerCase().replace(/^vite_/, "").replace(/_/g, "-");
            return `${key}=https://ci.invalid/${normalized}`;
          });
          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
          '

      - name: Install pinned Rollup Linux optional binary
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            @rollup/rollup-linux-x64-gnu@4.57.0
          node -e 'const value = require("./node_modules/@rollup/rollup-linux-x64-gnu/package.json").version; if (value !== "4.57.0") process.exit(1)'

      - name: Build with inert compile-time configuration
        run: npm run build

      - name: Confirm tracked working tree remains clean
        run: |
          set -euo pipefail
          if [[ -n "$(git status --short --untracked-files=no)" ]]; then
            echo "Mandatory checks modified tracked files" >&2
            git status --short --untracked-files=no
            exit 1
          fi
