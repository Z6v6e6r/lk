name: Residency booking safety
on:
  pull_request:
    paths: ['scripts/lib/residencyBooking*', 'scripts/nodered_residency_booking_nodes/**', 'scripts/patch_nodered_residency_booking.mjs', 'scripts/tests/residencyBooking*', 'scripts/tests/fixtures/residency-booking-context.mjs', 'scripts/tests/lk1PlanRulesPreview.test.mjs', '.github/workflows/residency-booking.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/tests/residencyBooking.test.mjs scripts/tests/lk1PlanRulesPreview.test.mjs scripts/tests/lk1PlanRulesResolver.test.mjs scripts/tests/lk1PatriotsFriendship.test.mjs scripts/tests/eventPaymentReadback.test.mjs
