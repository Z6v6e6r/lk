openapi: 3.1.0
info:
  title: PadlHub Managed Subscriptions API
  version: 0.1.0
  description: >
    Draft contract for managed annual subscriptions. It is the shared boundary
    for the current LK, the new LK and CUP. No path in this document is claimed
    to be deployed. Provider-specific write shapes remain gated by the Golden
    HAR passport.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development placeholder
tags:
  - name: Subscription Storefront
  - name: Subscription Usage
  - name: Subscription Operations
  - name: Subscription Admin
  - name: Subscription Analytics
  - name: Subscription Reconciliation
security:
  - bearerAuth: []
paths:
  /subscription-offers:
    get:
      tags: [Subscription Storefront]
      operationId: listSubscriptionOffers
      summary: List currently visible offers for one station.
      security: []
      parameters:
        - $ref: "#/components/parameters/StationIdQuery"
      responses:
        "200":
          description: Visible offers and authoritative release countdowns.
          content:
            application/json:
              schema:
                type: object
                required: [items, generatedAt]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionOffer"
                  generatedAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"

  /subscription-purchase-quotes:
    post:
      tags: [Subscription Storefront]
      operationId: quoteSubscriptionPurchase
      summary: Quote an offer without reserving inventory.
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseQuoteRequest"
      responses:
        "200":
          description: Short-lived purchase quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseQuote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /subscription-purchase-reservations:
    post:
      tags: [Subscription Storefront]
      operationId: reserveSubscriptionPurchase
      summary: Atomically reserve one unit from the quoted release phase.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseReservationRequest"
      responses:
        "201":
          description: Inventory reserved and payment preparation started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPurchase"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /subscription-purchases/{purchaseId}/confirm:
    post:
      tags: [Subscription Storefront]
      operationId: confirmSubscriptionPurchase
      summary: Reconcile payment and provider contract state.
      description: >
        This endpoint performs provider readback. A browser redirect or a
        payment HTTP 2xx is not sufficient to mark the contract ACTIVE.
      parameters:
        - $ref: "#/components/parameters/PurchaseIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Purchase is in a known non-ambiguous state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPurchase"
        "202":
          description: Durable reconciliation is still in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPurchase"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /me/subscriptions:
    get:
      tags: [Subscription Usage]
      operationId: listMySubscriptions
      summary: List the authenticated customer's subscription contracts.
      parameters:
        - name: includeExpired
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Contracts with current policy and usage summaries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionContractSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /subscription-eligibility-quotes:
    post:
      tags: [Subscription Usage]
      operationId: quoteSubscriptionEligibility
      summary: Evaluate entitlement, limits and price for one intended action.
      description: >
        The quote is explanatory and short-lived. Execution revalidates all
        rules and must not trust UI state.
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityQuoteRequest"
      responses:
        "200":
          description: Eligibility decision, including blockers when rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityQuote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /subscription-operations:
    post:
      tags: [Subscription Operations]
      operationId: createSubscriptionOperation
      summary: Execute a subscription-related command through a durable saga.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCommand"
      responses:
        "200":
          description: Operation completed synchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionOperation"
        "202":
          description: Durable operation accepted; completion is not implied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionOperation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /subscription-operations/{operationId}:
    get:
      tags: [Subscription Operations]
      operationId: getSubscriptionOperation
      summary: Read the durable outcome and projection status of an operation.
      parameters:
        - $ref: "#/components/parameters/OperationIdPath"
      responses:
        "200":
          description: Operation state and sanitized evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionOperation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/subscription-types:
    get:
      tags: [Subscription Admin]
      operationId: listAdminSubscriptionTypes
      summary: List managed and imported subscription types.
      parameters:
        - $ref: "#/components/parameters/StationIdOptionalQuery"
        - $ref: "#/components/parameters/PageCursorQuery"
      responses:
        "200":
          description: Subscription types visible to the operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionTypePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Subscription Admin]
      operationId: createAdminSubscriptionType
      summary: Create a draft subscription type.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionTypeRequest"
      responses:
        "201":
          description: Draft type created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /admin/subscription-types/{subscriptionTypeId}/policy-versions:
    post:
      tags: [Subscription Admin]
      operationId: createSubscriptionPolicyVersion
      summary: Create an immutable-candidate draft policy version.
      parameters:
        - $ref: "#/components/parameters/SubscriptionTypeIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyVersionRequest"
      responses:
        "201":
          description: Draft policy version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPolicyVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /admin/subscription-types/{subscriptionTypeId}/policy-versions/{version}/publish:
    post:
      tags: [Subscription Admin]
      operationId: publishSubscriptionPolicyVersion
      summary: Publish a policy after impact validation.
      parameters:
        - $ref: "#/components/parameters/SubscriptionTypeIdPath"
        - $ref: "#/components/parameters/PolicyVersionPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, expectedDraftRevision]
              properties:
                reason:
                  type: string
                  minLength: 10
                expectedDraftRevision:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Published version and impact summary.
          content:
            application/json:
              schema:
                type: object
                required: [policy, impact]
                properties:
                  policy:
                    $ref: "#/components/schemas/SubscriptionPolicyVersion"
                  impact:
                    $ref: "#/components/schemas/PolicyImpact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /admin/subscription-release-programs:
    get:
      tags: [Subscription Admin]
      operationId: listSubscriptionReleasePrograms
      summary: List release programs and inventory counters.
      parameters:
        - $ref: "#/components/parameters/StationIdOptionalQuery"
        - $ref: "#/components/parameters/PageCursorQuery"
      responses:
        "200":
          description: Release programs visible to the operator.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReleaseProgram"
                  nextCursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Subscription Admin]
      operationId: createSubscriptionReleaseProgram
      summary: Create a draft phased release program.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseProgramRequest"
      responses:
        "201":
          description: Draft release program created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseProgram"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /admin/subscription-release-programs/{releaseProgramId}/actions:
    post:
      tags: [Subscription Admin]
      operationId: changeSubscriptionReleaseProgramState
      summary: Publish, activate, pause, resume or close a release program.
      parameters:
        - $ref: "#/components/parameters/ReleaseProgramIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason, expectedRevision]
              properties:
                action:
                  type: string
                  enum: [PUBLISH, ACTIVATE, PAUSE, RESUME, CLOSE]
                reason:
                  type: string
                  minLength: 10
                expectedRevision:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Updated program.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseProgram"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/subscription-buyers:
    get:
      tags: [Subscription Admin]
      operationId: listSubscriptionBuyers
      summary: List purchases and linked provider contracts.
      parameters:
        - $ref: "#/components/parameters/StationIdOptionalQuery"
        - name: subscriptionTypeId
          in: query
          schema:
            type: string
        - name: releasePhaseId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PurchaseState"
        - $ref: "#/components/parameters/PageCursorQuery"
      responses:
        "200":
          description: Masked buyer records.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionBuyer"
                  nextCursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/subscription-provider-catalog:
    get:
      tags: [Subscription Admin]
      operationId: listSubscriptionProviderCatalog
      summary: Discover provider products and existing-contract counts read-only.
      description: >
        Discovery never changes provider contracts. Ambiguous and unmapped
        candidates remain quarantined until an operator approves a mapping.
      parameters:
        - $ref: "#/components/parameters/StationIdOptionalQuery"
        - name: mappingStatus
          in: query
          schema:
            type: string
            enum: [UNMAPPED, MAPPED, AMBIGUOUS, QUARANTINED]
        - $ref: "#/components/parameters/PageCursorQuery"
      responses:
        "200":
          description: Sanitized provider product candidates.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderProductCandidate"
                  nextCursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/subscription-provider-mappings:
    post:
      tags: [Subscription Admin]
      operationId: createSubscriptionProviderMapping
      summary: Map one discovered provider product to a managed type.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerProductCandidateId, subscriptionTypeId, reason]
              properties:
                providerProductCandidateId:
                  type: string
                subscriptionTypeId:
                  type: string
                reason:
                  type: string
                  minLength: 10
      responses:
        "201":
          description: Mapping created without mutating the provider product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProductMapping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /admin/subscription-import-jobs:
    post:
      tags: [Subscription Admin]
      operationId: createSubscriptionImportJob
      summary: Dry-run or apply local links for existing provider contracts.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerMappingIds, mode, reason]
              properties:
                providerMappingIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                mode:
                  type: string
                  enum: [DRY_RUN, APPLY_LOCAL_LINKS]
                expectedCandidateCount:
                  type: [integer, "null"]
                  minimum: 0
                reason:
                  type: string
                  minLength: 10
      responses:
        "202":
          description: Durable import job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionImportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /admin/subscription-import-jobs/{importJobId}:
    get:
      tags: [Subscription Admin]
      operationId: getSubscriptionImportJob
      summary: Read dry-run/apply results and unresolved candidates.
      parameters:
        - $ref: "#/components/parameters/ImportJobIdPath"
      responses:
        "200":
          description: Import job and preserved postcheck summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionImportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/subscription-analytics/ltv:
    get:
      tags: [Subscription Analytics]
      operationId: getSubscriptionLtv
      summary: Return source-backed gross and net LTV cohorts.
      parameters:
        - $ref: "#/components/parameters/StationIdOptionalQuery"
        - name: subscriptionTypeId
          in: query
          schema:
            type: string
        - name: cohortFrom
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: cohortTo
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: LTV report with metric definitions and completeness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LtvReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/subscription-reconciliation-cases:
    get:
      tags: [Subscription Reconciliation]
      operationId: listSubscriptionReconciliationCases
      summary: List ambiguous and partial lifecycle operations.
      parameters:
        - $ref: "#/components/parameters/StationIdOptionalQuery"
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, IN_PROGRESS, RESOLVED, ESCALATED]
        - $ref: "#/components/parameters/PageCursorQuery"
      responses:
        "200":
          description: Reconciliation cases.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReconciliationCase"
                  nextCursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/subscription-reconciliation-cases/{caseId}/actions:
    post:
      tags: [Subscription Reconciliation]
      operationId: actOnSubscriptionReconciliationCase
      summary: Run a reviewed readback, retry projection or explicit repair.
      parameters:
        - $ref: "#/components/parameters/CaseIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason, expectedRevision]
              properties:
                action:
                  type: string
                  enum: [READBACK, RETRY_PROJECTIONS, ESCALATE, RESOLVE_NO_CHANGE, APPLY_REVIEWED_REPAIR]
                reason:
                  type: string
                  minLength: 10
                expectedRevision:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Updated case after an idempotent action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationCase"
        "202":
          description: Durable action accepted and still running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationCase"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable caller-generated key. Reuse with a different payload is a conflict.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    StationIdQuery:
      name: stationId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    StationIdOptionalQuery:
      name: stationId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    PageCursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    PurchaseIdPath:
      name: purchaseId
      in: path
      required: true
      schema:
        type: string
    OperationIdPath:
      name: operationId
      in: path
      required: true
      schema:
        type: string
    SubscriptionTypeIdPath:
      name: subscriptionTypeId
      in: path
      required: true
      schema:
        type: string
    PolicyVersionPath:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ReleaseProgramIdPath:
      name: releaseProgramId
      in: path
      required: true
      schema:
        type: string
    CaseIdPath:
      name: caseId
      in: path
      required: true
      schema:
        type: string
    ImportJobIdPath:
      name: importJobId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Request shape or query is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Actor lacks permission for the station or action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource is absent or not visible to the actor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Current state, inventory, policy or idempotency conflicts with the command.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Domain validation failed before any external mutation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          minimum: 0
        currency:
          type: string
          enum: [RUB]

    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - AUTH_REQUIRED
        - FORBIDDEN
        - NOT_FOUND
        - POLICY_VERSION_CONFLICT
        - SUBSCRIPTION_NOT_ACTIVE
        - SUBSCRIPTION_ACTION_DISABLED
        - STATION_NOT_ALLOWED
        - EVENT_TYPE_NOT_ALLOWED
        - DURATION_NOT_ALLOWED
        - BOOKING_WINDOW_EXCEEDED
