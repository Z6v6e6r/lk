        label:
          type: string
          enum: [D30, D90, D180, D365, LIFETIME]
        customers:
          type: integer
          minimum: 0
        grossRevenue:
          $ref: "#/components/schemas/Money"
        refunds:
          $ref: "#/components/schemas/Money"
        netRevenue:
          $ref: "#/components/schemas/Money"

    LtvReport:
      type: object
      required: [cohortFrom, cohortTo, generatedAt, completeness, buckets]
      properties:
        cohortFrom:
          type: string
          format: date
        cohortTo:
          type: string
          format: date
        generatedAt:
          type: string
          format: date-time
        completeness:
          type: object
          required: [status, missingSources]
          properties:
            status:
              type: string
              enum: [COMPLETE, PARTIAL]
            missingSources:
              type: array
              items:
                type: string
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/LtvBucket"
        usageRate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        renewalRate:
          type: [number, "null"]
          minimum: 0
          maximum: 1

    ReconciliationCase:
      type: object
      required:
        - caseId
        - operationId
        - stationId
        - status
        - reasonCode
        - revision
        - observedStates
        - createdAt
        - updatedAt
      properties:
        caseId:
          type: string
        operationId:
          type: string
        stationId:
          type: string
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED, ESCALATED]
        reasonCode:
          type: string
          enum:
            - UPSTREAM_TIMEOUT_AFTER_WRITE
            - BOOKING_STATE_MISMATCH
            - VISIT_BALANCE_MISMATCH
            - PAYMENT_STATE_MISMATCH
            - CONTRACT_LINK_MISSING
            - ROSTER_PROJECTION_FAILED
            - CABINET_PROJECTION_FAILED
            - PUBLICATION_PROJECTION_FAILED
            - LATE_PAYMENT_AFTER_CANCELLATION
        revision:
          type: integer
          minimum: 1
        observedStates:
          type: object
          additionalProperties: true
        resolution:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
