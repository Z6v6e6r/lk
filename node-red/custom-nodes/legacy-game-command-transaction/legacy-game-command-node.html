<script type="text/javascript">
  RED.nodes.registerType("padlhub-legacy-game-command-store", {
    category: "config",
    defaults: {
      name: { value: "Legacy game command store" },
      mongoUriEnv: { value: "LK_LEGACY_COMMAND_MONGO_URI", required: true },
      databaseNameEnv: { value: "LK_LEGACY_COMMAND_MONGO_DB", required: true }

    label: function () {
      return this.name || "Legacy game command store";
    }
  });

<script type="text/javascript">
  RED.nodes.registerType("padlhub-legacy-game-command-operation", {
    category: "PadlHub",
    color: "#d8bfd8",
    defaults: {
      name: { value: "Legacy command operation" },
      store: { value: "", type: "padlhub-legacy-game-command-store", required: true },
      action: { value: "claim-result-sink", required: true },
      leaseMs: { value: 30000 },
      maxAttempts: { value: 3 }
    },
    inputs: 1,
    outputs: 2,
    icon: "font-awesome/fa-shield",
    label: function () { return this.name || this.action; }
  });
</script>

<script type="text/html" data-template-name="padlhub-legacy-game-command-operation">
  <div class="form-row">

    <label for="node-input-action">Action</label>

  <div class="form-row">
    <label for="node-input-leaseMs">Lease ms</label>

  <div class="form-row">

  </div>

<script type="text/html" data-help-name="padlhub-legacy-game-command-operation">
