# Owner-reviewed candidate only; install into the effective sshd include tree.
# Keep the account, home, authorized-key file and helper root-owned (no sudo/groups).
# The dedicated uid owns only /var/www/html/lk-frontend-releases.
Match User lk-frontend
    AuthorizedKeysFile /etc/ssh/authorized_keys/lk-frontend
    ForceCommand /usr/bin/python3 -I -B /usr/local/libexec/lk-frontend/frontend-release-remote.py
    DisableForwarding yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
    X11Forwarding no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
Match all
