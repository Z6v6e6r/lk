# Server-scope prerequisite. Replace the generation with the reviewed policy UUID.
# Every existing Node-RED proxy_pass must point to 127.0.0.1:18809, preserving its
# URI, CORS, limits and headers. The gateway forwards to 127.0.0.1:1880.
location = /__padlhub_release_probe {
    proxy_pass http://127.0.0.1:18809;
    proxy_set_header X-Padlhub-Edge-Worker $pid;
    proxy_set_header X-Padlhub-Edge-Generation 00000000-0000-4000-8000-000000000001;
}
