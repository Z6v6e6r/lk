    location = /lk/subscriptions/game-price-preview {
        if ($request_method = OPTIONS) { return 204; }

        if ($request_method != POST) { return 405; }

        client_max_body_size 16k;
        limit_req zone=lk_subscription_price_preview_by_ip burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:1880;
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Correlation-ID" always;
        add_header Access-Control-Expose-Headers "X-Correlation-ID" always;
        add_header Cache-Control "no-store" always;
    }
