# http context. Diagnostic claims are not identity, authorization or idempotency.
map "$request_method:$uri" $lk_game_read_route {
    default "";
    GET:/lk/games/available "";
    GET:/lk/games/by-phone "";
    GET:/lk/games/live-ratings "";
    GET:/lk/games/records "";
    GET:/lk/games/split "";
    GET:/lk/games/payment "";
    GET:/lk/games/confirm "";
    GET:/lk/games/health "";
    ~^GET:/lk/games/[A-Za-z0-9_-]+/result/state$ /lk/games/:gameId/result/state;
    ~^GET:/lk/games/[A-Za-z0-9_-]+$ /lk/games/:gameId;
}
map $lk_game_read_route $lk_game_read_loggable {
    default 1;
    "" 0;
}
map $http_x_lk_client_request_id $lk_game_read_client_id {
    default "UNKNOWN";
    "~*^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" $http_x_lk_client_request_id;
}
map $http_x_lk_client_build $lk_game_read_client_build {
    default "UNKNOWN";
    "~^[0-9a-f]{40}$" $http_x_lk_client_build;
}
# Times are seconds, strings preserve '-' (unavailable) and multiple upstreams.
# No URI, query, IP, User-Agent, Referer, body, Authorization or business ID.
log_format lk_game_read_diagnostics escape=json
    '{"schemaVersion":1,"source":"nginx","serverTime":"$time_iso8601",'
    '"edgeRequestId":"$request_id","clientRequestId":"$lk_game_read_client_id",'
    '"callerBuild":"$lk_game_read_client_build","routeTemplate":"$lk_game_read_route",'
    '"method":"$request_method","httpStatus":$status,"bodyBytes":$body_bytes_sent,'
    '"requestTimeSeconds":"$request_time","upstreamConnectTimeSeconds":"$upstream_connect_time",'
    '"upstreamHeaderTimeSeconds":"$upstream_header_time","upstreamResponseTimeSeconds":"$upstream_response_time",'
    '"upstreamStatus":"$upstream_status","requestCompletion":"$request_completion"}';
