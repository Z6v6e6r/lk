location = /lk/integrations/v1/game-create-schedule {
    # Network restriction. The service also verifies the signed LK2 request.
    allow 103.88.243.171;
    deny all;

    if ($request_method != GET) { return 405; }

    proxy_pass http://127.0.0.1:24811;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Subscription-Actor-Delegation $http_x_subscription_actor_delegation;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 18s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_buffering off;
    proxy_intercept_errors off;
    access_log off;
    # Nginx error messages can include the full query with a provider station ID.
    error_log /dev/null;
}
