# Reserve LK gateway for lk-reserve.89-108-64-209.sslip.io.
# Static bundle files are served locally from /var/www/html.
# LK API requests are proxied to the primary backend without duplicating writes.

map $http_origin $lk_cors_origin {
    default $http_origin;
    "" "*";
}

map $http_referer $lk_dev_suffix {
    default "";
    ~*^https?://padlhub\.ru/lk_dev([/?#]|$) "-dev";
}

server {
    listen 80;
    listen [::]:80;
    server_name lk-reserve.tsup.space;

    root /var/www/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /lk/release.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, Range" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /lk/release$lk_dev_suffix.json =404;
    }

    location = /lk/release-dev.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, Range" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /lk/bundle.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, Range" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files /lk/bundle$lk_dev_suffix.js =404;
    }

    location /lk/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, Range" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name lk-reserve.89-108-64-209.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lk-reserve.89-108-64-209.sslip.io;

    ssl_certificate /etc/letsencrypt/live/lk-reserve.89-108-64-209.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk-reserve.89-108-64-209.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_types application/javascript text/css application/json font/woff2 image/svg+xml;

    location = /lk/health {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin $lk_cors_origin always;
        add_header Vary Origin always;
        return 200 '{"ok":true,"service":"lk-reserve","mode":"static+proxy"}';
    }

    location = /lk/release.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /lk/release$lk_dev_suffix.json =404;
    }

    location = /lk/release-dev.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location = /lk/bundle.js {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /lk/bundle$lk_dev_suffix.js =404;
    }

    location ~* ^/lk/(bundle|games|tournaments|tournament-signup|tournament-subscription|tournament-subscription-referral|onboarding|levels-info|communities|ffc-academy)(-dev)?\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ^~ /lk/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ^~ /lk/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location = /lk/LPD.png {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ~ ^/lk/(analytics|advertising|chats|communities|games|media|onboarding|push|support|tournaments)(/|$) {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $lk_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key, Range" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        add_header Access-Control-Allow-Origin $lk_cors_origin always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key, Range" always;
        add_header Vary Origin always;
        add_header X-LK-Reserve-Proxy "primary-padlhub-su" always;
        add_header Cache-Control "no-store" always;

        proxy_http_version 1.1;
        proxy_set_header Host padlhub.su;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_ssl_server_name on;
        proxy_ssl_name padlhub.su;
        proxy_connect_timeout 3s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_redirect off;

        proxy_pass https://padlhub.su;
    }

    location ~ ^/seliger(/|$)? {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $lk_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        add_header Access-Control-Allow-Origin $lk_cors_origin always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key" always;
        add_header Vary Origin always;
        add_header X-LK-Reserve-Proxy "primary-padlhub-su" always;
        add_header Cache-Control "no-store" always;

        proxy_http_version 1.1;
        proxy_set_header Host padlhub.su;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_ssl_server_name on;
        proxy_ssl_name padlhub.su;
        proxy_connect_timeout 3s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_redirect off;

        proxy_pass https://padlhub.su;
    }

    location ^~ /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $lk_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key, Range" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        add_header Access-Control-Allow-Origin $lk_cors_origin always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key, Range" always;
        add_header Vary Origin always;
        add_header X-LK-Reserve-Proxy "primary-padlhub-su" always;
        add_header Cache-Control "no-store" always;

        proxy_http_version 1.1;
        proxy_set_header Host padlhub.su;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_ssl_server_name on;
        proxy_ssl_name padlhub.su;
        proxy_connect_timeout 3s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_redirect off;

        proxy_pass https://padlhub.su;
    }

    location /lk/ {
        try_files $uri =404;
    }
}
